<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сату қоңырауларын эмоциялық талдау жүйесі</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 800px; }
        .result-box {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .face-box {
            border: 2px solid #28a745;
            position: absolute;
        }
        .video-container {
            position: relative;
            margin: 20px 0;
        }
        #preview {
            max-width: 100%;
            height: auto;
        }
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Сату қоңырауларын эмоциялық талдау жүйесі</h1>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="image-tab" data-bs-toggle="tab" data-bs-target="#image" type="button" role="tab">Сурет талдауы</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="video-tab" data-bs-toggle="tab" data-bs-target="#video" type="button" role="tab">Бейне талдауы</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <!-- Image Analysis Tab -->
            <div class="tab-pane fade show active" id="image" role="tabpanel">
                <div class="card mt-4">
                    <div class="card-body">
                        <h5 class="card-title">Сурет жүктеу</h5>
                        <form id="imageForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <input type="file" class="form-control" id="imageFile" accept="image/*" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Суретті талдау</button>
                        </form>
                    </div>
                </div>

                <div class="loading" id="imageLoading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Жүктелуде...</span>
                    </div>
                    <p class="mt-2">Сурет талдануда...</p>
                </div>

                <div class="result-box" id="imageResult" style="display: none;">
                    <h5>Талдау нәтижелері</h5>
                    <div id="imagePreview" class="video-container"></div>
                    <div id="imageDetails"></div>
                </div>
            </div>

            <!-- Video Analysis Tab -->
            <div class="tab-pane fade" id="video" role="tabpanel">
                <div class="card mt-4">
                    <div class="card-body">
                        <h5 class="card-title">Бейне жүктеу</h5>
                        <form id="videoForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <input type="file" class="form-control" id="videoFile" accept="video/*" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Бейнені талдау</button>
                        </form>
                    </div>
                </div>

                <div class="loading" id="videoLoading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Жүктелуде...</span>
                    </div>
                    <p class="mt-2">Бейне өңделуде...</p>
                </div>

                <div class="result-box" id="videoResult" style="display: none;">
                    <h5>Талдау нәтижелері</h5>
                    <div id="videoPreview" class="video-container"></div>
                    <div id="videoDetails"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Image Analysis
        document.getElementById('imageForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const file = document.getElementById('imageFile').files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            // Show loading
            document.getElementById('imageLoading').style.display = 'block';
            document.getElementById('imageResult').style.display = 'none';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Display results
                const resultDiv = document.getElementById('imageResult');
                const previewDiv = document.getElementById('imagePreview');
                const detailsDiv = document.getElementById('imageDetails');

                // Create preview with face boxes
                const img = document.createElement('img');
                img.id = 'preview';
                img.src = URL.createObjectURL(file);
                previewDiv.innerHTML = '';
                previewDiv.appendChild(img);

                // Add face boxes
                data.faces.forEach(face => {
                    const box = document.createElement('div');
                    box.className = 'face-box';
                    box.style.left = face.bbox[0] + 'px';
                    box.style.top = face.bbox[1] + 'px';
                    box.style.width = face.bbox[2] + 'px';
                    box.style.height = face.bbox[3] + 'px';
                    previewDiv.appendChild(box);
                });

                // Display details
                detailsDiv.innerHTML = `
                    <h6>Анықталған беттер: ${data.faces.length}</h6>
                    ${data.faces.map((face, i) => `
                        <div class="mt-3">
                            <h6>Бет ${i + 1}</h6>
                            <p>Эмоция: ${['Ашулы', 'Жиіркену', 'Қорқыныш', 'Қуаныш', 'Қайғы', 'Таңданыс', 'Бейтарап'][face.emotion]}</p>
                            <p>Сенімділік: ${(face.confidence * 100).toFixed(1)}%</p>
                            <p>Сенімді: ${face.is_reliable ? 'Иә' : 'Жоқ'}</p>
                        </div>
                    `).join('')}
                `;

                resultDiv.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('Суретті талдауда қате орын алды');
            } finally {
                document.getElementById('imageLoading').style.display = 'none';
            }
        });

        // Video Analysis
        document.getElementById('videoForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const file = document.getElementById('videoFile').files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            // Show loading
            document.getElementById('videoLoading').style.display = 'block';
            document.getElementById('videoResult').style.display = 'none';

            try {
                const response = await fetch('/analyze-video', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Display results
                const resultDiv = document.getElementById('videoResult');
                const previewDiv = document.getElementById('videoPreview');
                const detailsDiv = document.getElementById('videoDetails');

                // Create video preview
                const video = document.createElement('video');
                video.controls = true;
                video.style.maxWidth = '100%';
                video.src = data.results.output_path;
                previewDiv.innerHTML = '';
                previewDiv.appendChild(video);

                // Display details
                detailsDiv.innerHTML = `
                    <h6>Талдау нәтижелері</h6>
                    <p>Ұзақтығы: ${data.results.duration.toFixed(1)} секунд</p>
                    <p>Белсенділік индексі: ${data.results.engagement_score.toFixed(1)}%</p>
                    <h6>Метрикалар</h6>
                    <p>Позитивті уақыт: ${data.results.metrics.positive_time.toFixed(1)} секунд</p>
                    <p>Негативті уақыт: ${data.results.metrics.negative_time.toFixed(1)} секунд</p>
                    <p>Бейтарап уақыт: ${data.results.metrics.neutral_time.toFixed(1)} секунд</p>
                    <p>Эмоция өзгерістері: ${data.results.metrics.emotion_changes}</p>
                `;

                resultDiv.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('Бейнені талдауда қате орын алды');
            } finally {
                document.getElementById('videoLoading').style.display = 'none';
            }
        });
    </script>
</body>
</html>
